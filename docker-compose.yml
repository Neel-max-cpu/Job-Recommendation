services:
  postgres:
    image: postgres:16
    container_name: job-recommendation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_recommendation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_recommendation"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: job-recommendation-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/job_recommendation
    ports:
      - "3000:3000"

volumes:
  postgres_data: